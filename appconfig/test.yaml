---
environment: production
environmentCode: test
container:
  applyQueueAddress: ffc-demo-apply
  redisHostname: DEVFFCINFRD1001.redis.cache.windows.net
  messageQueueHost: DEVFFCINFSB1001.servicebus.windows.net
ingress:
  server: azure.defra.cloud
  endpoint: ffc-demo-test
secretProviderClass:
  azure:
    keyvaultName: DEVFFCINFKV1001
    objects: # reading the secret from Azure Key Vault
      - objectName: devtest-ffcahwr-appInsights-connectionString # secret name in Azure Key Vault
        objectType: secret
      - objectName: dev-webCookiePassword
        objectType: secret
      - objectName: dev-redisPassword
        objectType: secret
  secretObjects:
    - secretName: ffc-demo-apply-web
      type: Opaque
      data:
        - objectName: devtest-ffcahwr-appInsights-connectionString
          key: APPINSIGHTS_CONNECTIONSTRING # they secret key in kubernetes secret and use in the application
        - objectName: dev-webCookiePassword
          key: COOKIE_PASSWORD
        - objectName: dev-redisPassword
          key: REDIS_PASSWORD
