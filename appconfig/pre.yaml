---
environment: production
environmentCode: pre
container:
  applyQueueAddress: ffc-demo-apply
  redisHostname: PREFFCINFRD1001.redis.cache.windows.net
  messageQueueHost: PREFFCINFSB1001.servicebus.windows.net
ingress:
  server: azure.defra.cloud
  endpoint: ffc-demo-pre
secretProviderClass:
  azure:
    keyvaultName: PREFFCINFKV1001
    objects: # reading the secret from Azure Key Vault
      - objectName: pre-ffcahwr-appinsights-connectionString # secret name in Azure Key Vault
        objectType: secret
      - objectName: pre-webCookiePassword
        objectType: secret
      - objectName: pre-redisPassword
        objectType: secret
  secretObjects:
    - secretName: ffc-demo-apply-web
      type: Opaque
      data:
        - objectName: pre-ffcahwr-appinsights-connectionString
          key: APPINSIGHTS_CONNECTIONSTRING # they secret key in kubernetes secret and use in the application
        - objectName: pre-webCookiePassword
          key: COOKIE_PASSWORD
        - objectName: pre-redisPassword
          key: REDIS_PASSWORD
